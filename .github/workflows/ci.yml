name: AERIS CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-lint:
    name: Frontend - Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint

  frontend-typecheck:
    name: Frontend - Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r type-check

  python-lint:
    name: ${{ matrix.name }} - Lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Aeryion Backend
            path: aeryion/backend
            lint_paths: app workers tests
          - name: Coltiva Backend
            path: coltiva/backend
            lint_paths: app workers tests
          - name: LinkTrade Backend
            path: linktrade/backend
            lint_paths: app workers tests
          - name: Shared
            path: shared
            lint_paths: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.path }}/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: ${{ matrix.path }}
      - run: flake8 ${{ matrix.lint_paths }} --max-line-length=120 --exclude=__pycache__
        working-directory: ${{ matrix.path }}
      - run: black --check ${{ matrix.lint_paths }}
        working-directory: ${{ matrix.path }}

  python-typecheck:
    name: ${{ matrix.name }} - Type Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Aeryion Backend
            path: aeryion/backend
            typecheck_path: app
          - name: Coltiva Backend
            path: coltiva/backend
            typecheck_path: app
          - name: LinkTrade Backend
            path: linktrade/backend
            typecheck_path: app
          - name: Shared
            path: shared
            typecheck_path: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.path }}/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: ${{ matrix.path }}
      - run: mypy ${{ matrix.typecheck_path }} --ignore-missing-imports
        working-directory: ${{ matrix.path }}

  python-test:
    name: ${{ matrix.name }} - Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Aeryion Backend
            path: aeryion/backend
          - name: Coltiva Backend
            path: coltiva/backend
          - name: LinkTrade Backend
            path: linktrade/backend
          - name: Shared
            path: shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.path }}/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: ${{ matrix.path }}
      - name: Run tests when present
        working-directory: ${{ matrix.path }}
        run: |
          if [ -d tests ] && find tests -type f -name 'test_*.py' | grep -q .; then
            set +e
            pytest tests/ -v --tb=short
            status=$?
            set -e
            if [ "$status" -eq 5 ]; then
              echo "No Python tests collected for ${{ matrix.name }}."
            else
              exit "$status"
            fi
          else
            echo "No Python tests found for ${{ matrix.name }}."
          fi

  ci-success:
    name: CI / All Checks Passed
    if: always()
    needs:
      - frontend-lint
      - frontend-typecheck
      - python-lint
      - python-typecheck
      - python-test
    runs-on: ubuntu-latest
    steps:
      - name: Verify job results
        run: |
          JOBS_JSON='${{ toJson(needs) }}'
          if echo "$JOBS_JSON" | grep -q '"result": "failure"' || echo "$JOBS_JSON" | grep -q '"result": "cancelled"'; then
            echo "One or more jobs failed or were cancelled."
            exit 1
          fi
          echo "All checks passed successfully."
