name: AERIS CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  aeryion-backend-lint:
    name: Aeryion Backend — Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || contains(join(github.event.pull_request.base.repo.name, ','), 'aeryion/') || contains(join(github.event.pull_request.base.repo.name, ','), 'shared/') || true
    defaults:
      run:
        working-directory: aeryion/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: flake8 app/ workers/ --max-line-length=120 --exclude=__pycache__
      - run: black --check app/ workers/

  aeryion-backend-typecheck:
    name: Aeryion Backend — Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aeryion/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: mypy app/ --ignore-missing-imports

  aeryion-backend-test:
    name: Aeryion Backend — Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aeryion/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --tb=short

  aeryion-dashboard-lint:
    name: Aeryion Dashboard — Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter aeryion-dashboard lint

  aeryion-dashboard-typecheck:
    name: Aeryion Dashboard — Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter aeryion-dashboard type-check

  coltiva-backend-lint:
    name: Coltiva Backend — Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coltiva/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: flake8 app/ workers/ --max-line-length=120 --exclude=__pycache__
      - run: black --check app/ workers/

  coltiva-backend-typecheck:
    name: Coltiva Backend — Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coltiva/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: mypy app/ --ignore-missing-imports

  coltiva-backend-test:
    name: Coltiva Backend — Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coltiva/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --tb=short

  linktrade-backend-lint:
    name: LinkTrade Backend — Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linktrade/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: flake8 app/ workers/ --max-line-length=120 --exclude=__pycache__
      - run: black --check app/ workers/

  linktrade-backend-typecheck:
    name: LinkTrade Backend — Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linktrade/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: mypy app/ --ignore-missing-imports

  linktrade-backend-test:
    name: LinkTrade Backend — Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linktrade/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --tb=short

  linktrade-web-lint:
    name: LinkTrade Web — Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter linktrade-web lint

  linktrade-web-typecheck:
    name: LinkTrade Web — Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter linktrade-web type-check

  shared-lint:
    name: Shared — Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: flake8 . --max-line-length=120 --exclude=__pycache__
      - run: black --check .

  shared-typecheck:
    name: Shared — Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: mypy . --ignore-missing-imports

  shared-test:
    name: Shared — Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --tb=short

  ci-success:
    name: "CI / All Checks Passed"
    if: always()
    needs:
      - aeryion-backend-lint
      - aeryion-backend-typecheck
      - aeryion-backend-test
      - aeryion-dashboard-lint
      - aeryion-dashboard-typecheck
      - coltiva-backend-lint
      - coltiva-backend-typecheck
      - coltiva-backend-test
      - linktrade-backend-lint
      - linktrade-backend-typecheck
      - linktrade-backend-test
      - linktrade-web-lint
      - linktrade-web-typecheck
      - shared-lint
      - shared-typecheck
      - shared-test
    runs-on: ubuntu-latest
    steps:
      - name: Verify job results
        run: |
          # Use the 'needs' context to check for any failures
          JOBS_JSON='${{ toJson(needs) }}'
          if echo "$JOBS_JSON" | grep -q '"result": "failure"' || echo "$JOBS_JSON" | grep -q '"result": "cancelled"'; then
            echo "One or more jobs failed or were cancelled."
            exit 1
          fi
          echo "All checks passed successfully!"
