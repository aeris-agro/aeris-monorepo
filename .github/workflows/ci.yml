name: AERIS CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PNPM_VERSION: "10.26.1"

jobs:
  frontend-lint:
    name: Frontend - Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint

  frontend-typecheck:
    name: Frontend - Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r type-check

  python-syntax:
    name: ${{ matrix.name }} - Syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Aeryion Backend
            path: aeryion/backend
            check_paths: app workers
          - name: Coltiva Backend
            path: coltiva/backend
            check_paths: app workers
          - name: LinkTrade Backend
            path: linktrade/backend
            check_paths: app workers
          - name: Shared
            path: shared
            check_paths: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q ${{ matrix.check_paths }}
        working-directory: ${{ matrix.path }}

  python-test:
    name: ${{ matrix.name }} - Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Aeryion Backend
            path: aeryion/backend
          - name: Coltiva Backend
            path: coltiva/backend
          - name: LinkTrade Backend
            path: linktrade/backend
          - name: Shared
            path: shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.path }}/requirements.txt
      - name: Install Python dependencies
        working-directory: ${{ matrix.path }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          else
            python -m pip install pytest
          fi
      - name: Run tests when present
        working-directory: ${{ matrix.path }}
        run: |
          if [ -d tests ] && find tests -type f -name 'test_*.py' | grep -q .; then
            set +e
            python -m pytest tests/ -v --tb=short
            status=$?
            set -e
            if [ "$status" -eq 5 ]; then
              echo "No Python tests collected for ${{ matrix.name }}."
            else
              exit "$status"
            fi
          else
            echo "No Python tests found for ${{ matrix.name }}."
          fi

  ci-success:
    name: CI / All Checks Passed
    if: always()
    needs:
      - frontend-lint
      - frontend-typecheck
      - python-syntax
      - python-test
    runs-on: ubuntu-latest
    steps:
      - name: Verify job results
        run: |
          JOBS_JSON='${{ toJson(needs) }}'
          if echo "$JOBS_JSON" | grep -q '"result": "failure"' || echo "$JOBS_JSON" | grep -q '"result": "cancelled"'; then
            echo "One or more jobs failed or were cancelled."
            exit 1
          fi
          echo "All checks passed successfully."
