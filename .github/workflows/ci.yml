name: AERIS CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  aeryion-lint:
    name: Aeryion — Lint
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      contains(join(github.event.pull_request.*.filename, ','), 'aeryion/') ||
      contains(join(github.event.pull_request.*.filename, ','), 'shared/')
    defaults:
      run:
        working-directory: aeryion/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: flake8 app/ workers/ --max-line-length=120 --exclude=__pycache__
      - run: black --check app/ workers/

  aeryion-typecheck:
    name: Aeryion — Type Check
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      contains(join(github.event.pull_request.*.filename, ','), 'aeryion/') ||
      contains(join(github.event.pull_request.*.filename, ','), 'shared/')
    defaults:
      run:
        working-directory: aeryion/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: mypy app/ --ignore-missing-imports

  aeryion-test:
    name: Aeryion — Test
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      contains(join(github.event.pull_request.*.filename, ','), 'aeryion/') ||
      contains(join(github.event.pull_request.*.filename, ','), 'shared/')
    defaults:
      run:
        working-directory: aeryion/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --tb=short

  coltiva-lint:
